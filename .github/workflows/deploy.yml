name: Deploy

# Runs after CI passes on main: build one image, push it to ACR, point the container app at it.
# Azure sign-in is OIDC (a federated credential), so no Azure secret is stored in GitHub. The
# three AZURE_* values are repository variables: identifiers, not credentials.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # lets the job request the OIDC token azure/login exchanges

concurrency:
  group: deploy
  cancel-in-progress: false # never cancel a deploy half way

env:
  REGISTRY: matchlenskehinde
  RESOURCE_GROUP: rg-matchlens
  APP: matchlens

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        run: |
          IMAGE="$REGISTRY.azurecr.io/matchlens:${HEAD_SHA::7}"
          az acr login --name "$REGISTRY"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Container Apps
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update --name "$APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" -o none

      - name: Check the new revision serves
        run: |
          URL="https://$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/")" = "200" ]; then
              echo "Serving at $URL"
              exit 0
            fi
            sleep 10
          done
          echo "The new revision did not serve within five minutes" >&2
          exit 1
