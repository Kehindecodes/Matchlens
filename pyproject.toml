[project]
name = "matchlens"
version = "0.1.0"
description = "A personalization layer for streaming platforms: one match, understood once, rendered as three experiences."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "numpy==2.5.3",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "azure-monitor-opentelemetry==1.8.11",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
]

[dependency-groups]
# The agents' stack, kept out of the runtime image until the agent path (A2) uses it.
agents = [
    "agent-framework==1.21.0",
    "azure-ai-projects==2.7.0",
]
dev = [
    "httpx==0.28.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
default-groups = ["dev", "agents"]  # local and CI installs keep everything

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matchlens", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
