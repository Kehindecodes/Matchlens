<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatchLens</title>
  <style>
    :root { --bg: #0f1115; --fg: #e8eaed; --muted: #9aa0a6; --accent: #34a853; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 16px; }
    .score { font-size: clamp(2rem, 8vw, 4rem); font-weight: 700; letter-spacing: 0.04em; }
    .score .goals { font-variant-numeric: tabular-nums; margin: 0 0.4em; }
    .clock { font-size: 1.5rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 8px; }
    .status { font-size: 0.85rem; color: var(--muted); margin-top: 24px; }
    .status.live::before { content: "●"; color: var(--accent); margin-right: 6px; }
    .cards { list-style: none; padding: 0; margin: 32px auto 0; max-width: 420px; display: grid; gap: 12px; text-align: left; }
    .card { background: #1a1d24; border: 1px solid #2a2f3a; border-radius: 12px; padding: 14px 16px; }
    .card time { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 0.9rem; }
    .card h2 { font-size: 1.1rem; margin: 4px 0; }
    .card p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="score">
      <span id="home-name">HOME</span><span class="goals" id="home-goals">0</span>–<span class="goals" id="away-goals">0</span><span id="away-name">AWAY</span>
    </div>
    <div class="clock"><span id="clock">00:00</span> · <span id="period">waiting for kickoff</span></div>
    <div class="status" id="status">connecting…</div>
    <ol class="cards" id="cards" aria-live="polite"></ol>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
